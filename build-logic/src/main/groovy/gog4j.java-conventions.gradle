plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'io.github.ben-manes.versions'
    id 'com.google.osdetector'
}

group = 'org.jtaccuino'
version = rootProject.findProperty('releaseVersion') ?: '0.5-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    javafxVersion = '26'
    hardwoodVersion = '1.1.0.Beta1'
    dflibVersion = '2.0.0-M7'
    junitVersion = '5.11.4'
    batikVersion = '1.17'
    commonsMathVersion = '4.0-beta1'
    incubatorVersion = '26.0.1'

    // JavaFX ships platform-specific jars; pick the classifier matching the
    // running OS/architecture (mirrors what javafx-maven-plugin does).
    javaFxPlatform = osdetector.os == 'osx' ? 'mac' : osdetector.os == 'windows' ? 'win' : osdetector.os
    javaFxPlatform = osdetector.arch == 'aarch_64' ? javaFxPlatform + '-aarch64' : javaFxPlatform
    // jfx-incubator-input publishes no aarch64-specific jars, so Apple Silicon
    // falls back to the plain mac/linux/win classifier.
    inputFxPlatform = javaFxPlatform == 'mac-aarch64' ? 'mac'
            : javaFxPlatform == 'linux-aarch64' ? 'linux' : javaFxPlatform
}

// The JavaFX jars live in the dedicated javafx configuration; hand those
// straight to --module-path (not the runtime classpath, which also carries
// the empty unclassified stub jars that the classified POMs drag in).
configurations {
    javafx {
        description = 'JavaFX platform libraries'
    }
    implementation {
        extendsFrom configurations.javafx
    }
}

ext.javafxModulePath = { ->
    configurations.javafx.files.collect { it.absolutePath }.join(File.pathSeparator)
}

// Resolves the JVM command-line arguments that start a JFR recording driven by
// the bundled plot-benchmark.jfc settings (shipped by :gog4j). The settings
// file is read from the core module's processed resources and the recording
// targets the desktop by default; override -PjfrFile=... for a distinct file.
ext.jfrStartRecordingArgs = { Project p ->
    def core = p.rootProject.findProject(':gog4j')
    def settingsFile = new File(core.layout.buildDirectory.get().asFile, 'resources/main/jfr/plot-benchmark.jfc')
    def jfrFile = p.findProperty('jfrFile')
            ?: new File(p.layout.buildDirectory.get().asFile, 'jfr/plot-benchmark.jfr').absolutePath
    // JFR refuses to start if the recording file's parent directory does not
    // already exist, so make sure it is created before the VM boots.
    new File(jfrFile).parentFile.mkdirs()
    return ["-XX:StartFlightRecording=settings=${settingsFile},filename=${jfrFile},name=plotbench"]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
    withSourcesJar()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Turn on every javac diagnostic group so warnings surface consistently
    // across compilers (javac defaults vary).
    options.compilerArgs += ['-Xlint:all', '-Werror', '-Xmaxwarns', '10000']
}

javadoc {
    options.encoding = 'UTF-8'
    // Report every diagnostic so the build surfaces all issues at once.
    options.addStringOption('Xmaxwarns', '10000')
    // Treat javadoc warnings as errors, matching the -Werror policy.
    options.addStringOption('Xwerror', '-quiet')
}

test {
    useJUnitPlatform {
        // The JFR phase-timing and render-pulse benchmarks warm up and render
        // for minutes and are not assertion gates; run them via benchmarkTest.
        excludeTags 'benchmark'
    }
    // The tests render JavaFX scenes off-screen; the headless glass platform
    // needs no display and no window manager, and software prism because the
    // headless glass has no GPU pipeline.
    jvmArgs '-Dglass.platform=headless', '-Dprism.order=sw', '--enable-native-access=ALL-UNNAMED'
}

spotless {
    java {
        targetExclude 'src/ap/java/**'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
        importOrder('\\#', '')
        replaceRegex('noStarImports', '(\\n)import (static )?[a-zA-Z0-9.]*[.][\\*];\\n', '$1')
        replaceRegex('noMultipleEmptyLines', '(\\n\\n)\\n+', '$1')
        replaceRegex('Remove @author javadoc taglets', '\\n\\s*\\*\\s*@author.*', '')
        replaceRegex('Remove trailing empty comment lines', '\\n\\s*\\*(\\n\\s*\\*/\\n)', '$1')
        replaceRegex('Remove empty javadoc', '(\\n)\\s*/\\*(\\n)\\s*\\*/(\\n)', '$1$3')
        replaceRegex('Remove empty lines before end of block', '(\\n)[\\n]+(\\s*})(?=\\n)', '$1$2')
        licenseHeaderFile(rootProject.file('spotless-license-header.txt'), '^package ')
    }
}

check.dependsOn 'spotlessCheck'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = project.description ?: ''
                url = 'https://github.com/jtaccuino/gog4j'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jtaccuino/gog4j')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
