name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish release to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      # Check out sources (full history so the tag version resolves)
      - name: Fetch Sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Setup JDK environment
      - name: Setup JDK 26
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: gradle

      # Setup gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true

      # Derive the release version from the tag (v1.2.3 -> 1.2.3)
      - name: Derive release version
        id: version
        run: echo "releaseVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Run checks
      - name: Run check tasks
        run: ./gradlew --no-daemon --warning-mode all check

      # Publish the release to GitHub Packages
      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon --warning-mode all publish -PreleaseVersion=${{ steps.version.outputs.releaseVersion }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Archive build logs
      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publish-build-logs
          retention-days: 5
          path: |
            **/build/reports/*
